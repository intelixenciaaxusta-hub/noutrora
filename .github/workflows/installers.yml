name: Instaladores
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/bootstrap.py && python3 scripts/build.py && python3 scripts/package_native.py
      - run: python3 scripts/package_mac.py
      - uses: actions/upload-artifact@v4
        with: { name: Noutrora-mac, path: dist/releases/Noutrora.dmg }
