// --- PRECONFIGURACIÓN DIRECTA DE EXTENSIÓNS (ALMACENAMENTO LOCAL JSON) ---
lockPref("extensions.webextensions.ExtensionStorageIDB.enabled", false);

// --- IDENTIDAD VISUAL NOUTRORA v2.0 (SUPERPOSICIÓN 100% EXTERNA SIN TOCAR OMNI.JA) ---
try {
  const { classes: Cc, interfaces: Ci } = Components;

  // 0. Preconfigurar almacenamento inicial das extensións (TWP a galego automático e SponsorBlock)
  try {
    const dirSvc = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
    const profDir = dirSvc.get("ProfD", Ci.nsIFile);

    const writeExtensionStorage = (extId, dataObj) => {
      try {
        const extDir = profDir.clone();
        extDir.append("browser-extension-data");
        extDir.append(extId);
        if (!extDir.exists()) {
          extDir.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
        }
        const storageFile = extDir.clone();
        storageFile.append("storage.js");
        if (!storageFile.exists()) {
          const foStream = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
          foStream.init(storageFile, 0x02 | 0x08 | 0x20, 0o644, 0);
          const data = JSON.stringify(dataObj);
          foStream.write(data, data.length);
          foStream.close();
        }
      } catch (_) {}
    };

    // TWP: Traducir sempre a galego (incluíndo español) e casilla activada por defecto
    writeExtensionStorage("{036a55b4-5e72-4d05-a06c-cba2dfcc134a}", {
      targetLanguage: "gl",
      targetLanguageTextTranslation: "gl",
      targetLanguages: ["gl", "es", "en"],
      alwaysTranslateLangs: ["es", "en", "pt", "fr", "de", "it", "ca", "eu", "ja", "zh", "ru"],
      showButtonInTheAddressBar: "no",
      showReleaseNotes: "no"
    });

    // SponsorBlock: Marcar como xa instalado para evitar calquera pestana de benvida
    writeExtensionStorage("sponsorBlocker@ajay.app", {
      userID: "noutrora-calma",
      alreadyInstalled: true
    });
  } catch (_) {}

  // 1. Registrar el overlay externo de marca (noutrora-overlay/chrome.manifest) en memoria
  try {
    const dirSvc = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
    const mFile = dirSvc.get("GreD", Ci.nsIFile);
    mFile.append("noutrora-overlay");
    mFile.append("chrome.manifest");
    if (mFile.exists()) {
      Components.manager.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(mFile);
    }
  } catch (e) {}

  // 2. Fijar la página de 6 tarjetas (Puerto Base) de forma dinámica para cualquier equipo/SO (Linux, Windows, macOS)
  try {
    let homeURI = "chrome://noutrora-branding/content/home.html";
    try {
      const dirSvc = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
      const homeFile = dirSvc.get("GreD", Ci.nsIFile);
      homeFile.append("noutrora-overlay");
      homeFile.append("content");
      homeFile.append("home.html");
      if (homeFile.exists()) {
        const ioSvc = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
        homeURI = ioSvc.newFileURI(homeFile).spec;
      }
    } catch (e) {}
    lockPref("browser.startup.homepage", homeURI);

    const importESModule =
      typeof ChromeUtils !== "undefined" && ChromeUtils.importESModule
        ? ChromeUtils.importESModule
        : Components.utils.importESModule;
    const { AboutNewTab } = importESModule("resource:///modules/AboutNewTab.sys.mjs");
    AboutNewTab.newTabURL = homeURI;

    // Protexer sesións: as webs con inicios de sesión gardados manteñen as súas cookies ao pechar
    try {
      const preserveLoginCookies = () => {
        try {
          const permMgr = Cc["@mozilla.org/permissionmanager;1"].getService(Ci.nsIPermissionManager);
          const loginMgr = Cc["@mozilla.org/login-manager;1"].getService(Ci.nsILoginManager);
          const logins = loginMgr.getAllLogins();
          for (const l of logins) {
            try {
              const uri = Services.io.newURI(l.hostname);
              const principal = Services.scriptSecurityManager.createContentPrincipal(uri, {});
              permMgr.addFromPrincipal(principal, "cookie", permMgr.ALLOW_ACTION, permMgr.EXPIRE_NEVER);
            } catch (_) {}
          }
        } catch (_) {}
      };
      preserveLoginCookies();
      Services.obs.addObserver({ observe: preserveLoginCookies }, "passwordmgr-storage-changed");
    } catch (_) {}

    // Tradución e nomes propios da Bitácora nos cartafoles raíz de Places
    try {
      const { PlacesUtils } = importESModule("resource://gre/modules/PlacesUtils.sys.mjs");
      const origGetString = PlacesUtils.getString ? PlacesUtils.getString.bind(PlacesUtils) : null;
      if (origGetString) {
        PlacesUtils.getString = function(key) {
          switch (key) {
            case "BookmarksToolbarFolderTitle": return "Barra da Bitácora";
            case "BookmarksMenuFolderTitle": return "Menú da Bitácora";
            case "OtherBookmarksFolderTitle": return "Outra Bitácora";
            case "MobileBookmarksFolderTitle": return "Bitácora móbil";
            case "OrganizerQueryAllBookmarks": return "Toda a Bitácora";
            default: return origGetString(key);
          }
        };
      }
      PlacesUtils.bookmarks.update({ guid: PlacesUtils.bookmarks.toolbarGuid, title: "Barra da Bitácora" }).catch(() => {});
      PlacesUtils.bookmarks.update({ guid: PlacesUtils.bookmarks.menuGuid, title: "Menú da Bitácora" }).catch(() => {});
      PlacesUtils.bookmarks.update({ guid: PlacesUtils.bookmarks.unfiledGuid, title: "Outra Bitácora" }).catch(() => {});
    } catch (_) {}

    // Tradución dinámica e adaptación cultural das vistas da barra lateral (Megalist e Historial)
    try {
      const sideObs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
      sideObs.addObserver(
        {
          observe(aSubject, aTopic) {
            try {
              if (aTopic === "chrome-document-global-created" && aSubject) {
                const docWin = aSubject;
                docWin.addEventListener(
                  "DOMContentLoaded",
                  () => {
                    try {
                      const href = (docWin.location && docWin.location.href) || "";
                      if (href.includes("megalist.html")) {
                        const fixMegalist = () => {
                          const h = docWin.document.querySelector('[data-l10n-id="contextual-manager-passwords-no-passwords-header-2"]');
                          if (h && (!h.textContent || h.textContent.includes("Save your passwords") || h.textContent.includes("safe spot"))) {
                            h.textContent = "Garda os teus contrasinais nun lugar seguro";
                          }
                        };
                        fixMegalist();
                        docWin.setTimeout(fixMegalist, 100);
                        docWin.setTimeout(fixMegalist, 400);
                        new docWin.MutationObserver(fixMegalist).observe(docWin.document.documentElement, {
                          childList: true,
                          subtree: true,
                        });
                      }
                      if (href.includes("sidebar-history.html")) {
                        const fixHistory = () => {
                          const emptyState = docWin.document.querySelector("fxview-empty-state");
                          if (emptyState) {
                            const root = emptyState.shadowRoot || emptyState;
                            const h2 = root.querySelector("#header, .header");
                            if (h2 && (!h2.textContent || h2.textContent.includes("trail starts here"))) {
                              h2.textContent = "Navegación sen rastro";
                            }
                            const p = root.querySelector("p, .description");
                            if (p && (!p.textContent || p.textContent.includes("As you visit pages"))) {
                              p.textContent =
                                "O historial está desactivado en Noutrora para protexer a túa intimidade. Non se garda ningún rexistro das túas viaxes nin páxinas visitadas.";
                            }
                          }
                        };
                        fixHistory();
                        docWin.setTimeout(fixHistory, 100);
                        docWin.setTimeout(fixHistory, 400);
                        new docWin.MutationObserver(fixHistory).observe(docWin.document.documentElement, {
                          childList: true,
                          subtree: true,
                        });
                      }
                    } catch (_) {}
                  },
                  { once: true }
                );
              }
            } catch (_) {}
          },
        },
        "chrome-document-global-created"
      );
    } catch (_) {}

    const obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
    obs.addObserver(
      {
        observe(win) {
          try {
            if (win && Array.isArray(win.gInitialPages) && !win.gInitialPages.includes(homeURI)) {
              win.gInitialPages.push(homeURI);
            }

            // Renombrar «Marcadores» a «Bitácora» en toda la interfaz de la ventana
            const doc = win.document;
            const applyBitacoraLabels = () => {
              const labelTargets = [
                ["bookmarksMenu", "Bitácora"],
                ["appMenu-bookmarks-button", "Bitácora"],
                ["bookmarks-menu-button", "Bitácora"],
                ["sidebar-switcher-bookmarks", "Bitácora"],
                ["BMB_viewBookmarksSidebar", "Ver panel lateral da Bitácora"],
                ["BMB_bookmarksShowAllTop", "Administrar a Bitácora"],
                ["BMB_bookmarksShowAll", "Administrar a Bitácora"],
                ["menu_bookmarkThisPage", "Anotar esta páxina na Bitácora"],
                ["context-bookmarkpage", "Anotar páxina na Bitácora…"],
                ["panelMenu_bookmarksToolbar", "Barra da Bitácora"],
                ["toggle_PersonalToolbar", "Barra da Bitácora"],
              ];
              for (const [id, text] of labelTargets) {
                const el = doc.getElementById(id);
                if (el) {
                  el.setAttribute("label", text);
                  if (el.hasAttribute("value")) el.setAttribute("value", text);
                  if (el.hasAttribute("tooltiptext")) el.setAttribute("tooltiptext", text);
                }
              }

              const pt = doc.getElementById("PersonalToolbar");
              if (pt) {
                pt.setAttribute("toolbarname", "Barra da Bitácora");
                pt.setAttribute("aria-label", "Bitácora");
              }

              const starBox = doc.getElementById("star-button-box");
              if (starBox) {
                starBox.setAttribute("tooltiptext", "Anotar esta páxina na Bitácora");
              }
              const starBtn = doc.getElementById("star-button");
              if (starBtn) {
                starBtn.setAttribute("tooltiptext", "Anotar esta páxina na Bitácora");
              }

              const panelHeader = doc.querySelector("#PanelUI-bookmarks .subview-subheader, #PanelUI-bookmarks h1");
              if (panelHeader) {
                panelHeader.textContent = "Bitácora";
              }
            };

            applyBitacoraLabels();
            doc.addEventListener("popupshowing", applyBitacoraLabels);
            doc.addEventListener("ViewShowing", applyBitacoraLabels);

            // 3. Silenciar completamente as pestanas de benvida de calquera extensión
            const gBrowser = win.gBrowser;
            if (gBrowser) {
              const closeIfExtensionWelcome = (tab) => {
                try {
                  if (!tab || !tab.linkedBrowser) return false;
                  const b = tab.linkedBrowser;
                  const spec = (b.currentURI && b.currentURI.spec) || "";
                  if (
                    spec.startsWith("moz-extension://") &&
                    (spec.includes("/options/options.html") ||
                     spec.includes("/help/index.html") ||
                     spec.includes("/permissions/index.html") ||
                     spec.includes("release-notes") ||
                     spec.includes("options.html"))
                  ) {
                    // Se a pestana a pechar está seleccionada, pasar o foco á de inicio
                    if (tab.selected && gBrowser.tabs.length > 1) {
                      const homeTab = gBrowser.tabs[0];
                      if (homeTab && homeTab !== tab) {
                        gBrowser.selectedTab = homeTab;
                      }
                    }
                    gBrowser.removeTab(tab);
                    return true;
                  }
                } catch (_) {}
                return false;
              };

              // Escoitar cambios de localización e estado de calquera pestana en tempo real
              try {
                gBrowser.addTabsProgressListener({
                  onLocationChange(aBrowser, aWebProgress, aRequest, aLocationURI, aFlags) {
                    try {
                      if (!aLocationURI) return;
                      const spec = aLocationURI.spec || "";
                      if (
                        spec.startsWith("moz-extension://") &&
                        (spec.includes("/options/options.html") ||
                         spec.includes("/help/index.html") ||
                         spec.includes("/permissions/index.html") ||
                         spec.includes("release-notes") ||
                         spec.includes("options.html"))
                      ) {
                        const tab = gBrowser.getTabForBrowser(aBrowser);
                        if (tab && gBrowser.tabs.length > 1) {
                          if (tab.selected) {
                            gBrowser.selectedTab = gBrowser.tabs[0];
                          }
                          try { gBrowser.removeTab(tab); } catch (_) {}
                        }
                      }
                    } catch (_) {}
                  },
                  onStateChange(aBrowser, aWebProgress, aRequest, aStateFlags, aStatus) {
                    try {
                      const u = (aBrowser && aBrowser.currentURI && aBrowser.currentURI.spec) || "";
                      if (
                        u.startsWith("moz-extension://") &&
                        (u.includes("/options/options.html") ||
                         u.includes("/help/index.html") ||
                         u.includes("release-notes") ||
                         u.includes("options.html"))
                      ) {
                        const tab = gBrowser.getTabForBrowser(aBrowser);
                        if (tab && gBrowser.tabs.length > 1) {
                          if (tab.selected) {
                            gBrowser.selectedTab = gBrowser.tabs[0];
                          }
                          try { gBrowser.removeTab(tab); } catch (_) {}
                        }
                      }
                    } catch (_) {}
                  },
                });
              } catch (_) {}

              // Escoitar creación e modificación de pestanas
              if (gBrowser.tabContainer) {
                gBrowser.tabContainer.addEventListener("TabOpen", (e) => {
                  const tab = e.target;
                  const b = tab && tab.linkedBrowser;
                  if (b) {
                    const check = () => {
                      try {
                        const u = (b.currentURI && b.currentURI.spec) || "";
                        if (
                          u.startsWith("moz-extension://") &&
                          (u.includes("options.html") || u.includes("help") || u.includes("release-notes"))
                        ) {
                          if (tab.selected && gBrowser.tabs.length > 1) {
                            gBrowser.selectedTab = gBrowser.tabs[0];
                          }
                          try { gBrowser.removeTab(tab); } catch (_) {}
                        }
                      } catch (_) {}
                    };
                    b.addEventListener("load", check, { once: true });
                    win.setTimeout(check, 100);
                    win.setTimeout(check, 500);
                    win.setTimeout(check, 1500);
                  }
                });
                gBrowser.tabContainer.addEventListener("TabAttrModified", (e) => {
                  closeIfExtensionWelcome(e.target);
                });
              }

              // Varrer periodicamente durante os primeiros 20 segundos
              const cleanTimer = win.setInterval(() => {
                for (const t of Array.from(gBrowser.tabs)) {
                  closeIfExtensionWelcome(t);
                }
              }, 150);
              win.setTimeout(() => win.clearInterval(cleanTimer), 20000);
            }
          } catch (e) {}
        },
      },
      "browser-delayed-startup-finished"
    );
  } catch (e) {}

  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const ios = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);

  const customCSS = `
    @-moz-document url("chrome://browser/content/browser.xhtml") {
      :root,
      #main-window,
      #navigator-toolbox {
        --noutrora-abismo: #1B3644;
        --noutrora-bruma: #7A9E9F;
        --noutrora-arena: #D6D3C9;
        --noutrora-espuma: #FAF9F5;
        --noutrora-horizonte94: #0F232E;

        /* Variables globales del tema de Firefox con la Paleta Océano Atlántico */
        --lwt-accent-color: #D6D3C9 !important;
        --lwt-text-color: #1B3644 !important;
        --toolbar-bgcolor: #FAF9F5 !important;
        --toolbar-color: #1B3644 !important;
        --toolbar-field-background-color: #FFFFFF !important;
        --toolbar-field-color: #1B3644 !important;
        --toolbar-field-border-color: #D6D3C9 !important;
        --toolbar-field-focus-background-color: #FFFFFF !important;
        --toolbar-field-focus-color: #1B3644 !important;
        --toolbar-field-focus-border-color: #7A9E9F !important;
        --toolbarbutton-icon-fill: #1B3644 !important;
        --toolbarbutton-icon-fill-attention: #7A9E9F !important;
        --toolbarbutton-hover-background: rgba(122, 158, 159, 0.20) !important;
        --toolbarbutton-active-background: rgba(122, 158, 159, 0.34) !important;
        --toolbarbutton-border-radius: 10px !important;
        --tab-border-radius: 10px !important;
        --tab-selected-bgcolor: #FAF9F5 !important;
        --tab-selected-textcolor: #1B3644 !important;
        --urlbar-icon-border-radius: 8px !important;
        --arrowpanel-background: #FAF9F5 !important;
        --arrowpanel-color: #1B3644 !important;
        --arrowpanel-border-color: #D6D3C9 !important;
        --arrowpanel-border-radius: 10px !important;
        --focus-outline-color: #7A9E9F !important;
      }

      /* Barra superior de pestañas en Arena de Bajamar (#D6D3C9) como en Figura 4 del Manual */
      #titlebar,
      #TabsToolbar {
