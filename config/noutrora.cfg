// Noutrora Browser Configuration (Fastfox + Debloat + Branding)
// La primera línea debe ser siempre un comentario

// --- VELOCIDAD Y RENDIMIENTO (Fastfox) ---
defaultPref("nglayout.initialpaint.delay", 0);
defaultPref("nglayout.initialpaint.delay_in_oopif", 0);
defaultPref("content.notify.interval", 100000);
defaultPref("gfx.webrender.all", true);
defaultPref("layers.gpu-process.enabled", true);
defaultPref("media.memory_cache_max_size", 65536);
defaultPref("network.http.max-connections", 1800);
defaultPref("network.http.max-persistent-connections-per-server", 10);
defaultPref("network.dnsCacheEntries", 1000);
defaultPref("network.dnsCacheExpiration", 3600);
defaultPref("network.ssl_tokens_cache_capacity", 10240);

// --- RECORTE DE TELEMETRÍA, IA Y BLOATWARE ---
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.server", "data:,");
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("breakpad.reportURL", "");
lockPref("browser.tabs.crashReporting.sendReport", false);
lockPref("extensions.pocket.enabled", false);
lockPref("browser.ml.enable", false);
lockPref("browser.ml.chat.enabled", false);
lockPref("browser.ml.chat.sidebar", false);
lockPref("browser.vpn_promo.enabled", false);
lockPref("browser.promo.focus.enabled", false);

// --- INTERFAZ LIMPIA, ARRANQUE LIMPIO Y MARCADORES ---
defaultPref("browser.toolbars.bookmarks.visibility", "always");
defaultPref("browser.startup.page", 1);
defaultPref("browser.startup.homepage", "http://noutrora.local:8080/terminal.html");
defaultPref("browser.startup.firstrunSkipsHomepage", false);
lockPref("browser.startup.couldRestoreSession.count", -1);
lockPref("browser.sessionstore.resume_from_crash", false);
lockPref("browser.sessionstore.max_resumed_crashes", 0);
lockPref("browser.urlbar.trimURLs", false);
lockPref("browser.urlbar.trimHttps", false);
lockPref("security.insecure_connection_text.enabled", false);
lockPref("security.insecure_connection_text.pbmode.enabled", false);
lockPref("security.insecure_field_warning.contextual.enabled", false);

// --- CERO MENSAJES MOLESTOS NI POPUPS DEL NAVEGADOR ---
lockPref("browser.aboutwelcome.enabled", false);
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("signon.rememberSignons", false);
lockPref("signon.autofillForms", false);
lockPref("signon.generation.enabled", false);
lockPref("signon.management.page.breach-alerts.enabled", false);
lockPref("signon.firefoxRelay.feature", "disabled");
lockPref("extensions.formautofill.addresses.enabled", false);
lockPref("extensions.formautofill.creditCards.enabled", false);
lockPref("browser.translations.automaticallyPopup", false);
lockPref("browser.messaging-system.whatsNewPanel.enabled", false);
lockPref("browser.uitour.enabled", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);
lockPref("permissions.default.desktop-notification", 2);
lockPref("browser.tabs.warnOnClose", false);
lockPref("browser.tabs.warnOnCloseOtherTabs", false);
lockPref("browser.warnOnQuitShortcut", false);
lockPref("browser.aboutConfig.showWarning", false);
lockPref("full-screen-api.warning.timeout", 0);

// --- IDENTIDAD VISUAL NOUTRORA (TIMÓN DE BARCO + NOMBRE) ---
try {
  const { classes: Cc, interfaces: Ci } = Components;
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const ios = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);

  const customCSS = `
    @-moz-document url("chrome://browser/content/browser.xhtml") {
      #identity-box.notSecureText #identity-icon-label {
        display: none !important;
      }
    }
    @-moz-document url("about:newtab"), url("about:home") {
      .logo-and-wordmark .logo {
        background-image: url("data:image/svg+xml;base64,__NOUTRORA_SVG_BASE64__") !important;
        background-size: 82px !important;
        width: 82px !important;
        height: 82px !important;
      }
      .logo-and-wordmark .wordmark {
        background: none !important;
        width: auto !important;
        height: auto !important;
        display: flex !important;
        align-items: center !important;
      }
      .logo-and-wordmark .wordmark::after {
        content: "Noutrora";
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-inline-start: 14px;
        color: var(--newtab-text-primary-color, #f5c45e);
      }
    }
  `;

  const uri = ios.newURI("data:text/css;charset=UTF-8," + encodeURIComponent(customCSS));
  if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
  }
} catch (e) {}
